  bio: "Hello! I am an undergraduate student and aspiring bioinformatician at Duke Kunshan University, majoring in Genetics and Genomics within the Molecular Biosciences program. I am particularly interested in epigenetics and RNA biology and how they can illuminate gynecologic conditions such as endometriosis and ovarian cancer, where major knowledge gaps and unmet clinical needs remain. More specifically, I aim to explore non‑hormonal therapeutic strategies for gynecologic diseases and malignancies, with a focus on improving efficacy while minimizing physiological and mental adverse effects."
