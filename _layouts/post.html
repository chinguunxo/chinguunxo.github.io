---
layout: default
---

<article class="post-page">
  <header class="post-header">
    <div class="post-meta-top">
      <a href="{{ '/blog' | relative_url }}" class="back-link">← All posts</a>
      <span class="post-date">{{ page.date | date: "%B %-d, %Y" }}</span>
    </div>
    <h1 class="post-title">{{ page.title }}</h1>
    {% if page.subtitle %}<p class="post-subtitle">{{ page.subtitle }}</p>{% endif %}
    {% if page.tags.size > 0 %}
    <div class="post-tags">
      {% for tag in page.tags %}<span class="tag">{{ tag }}</span>{% endfor %}
    </div>
    {% endif %}
  </header>

  <div class="post-body">
    {{ content }}
  </div>

  <footer class="post-footer">
    <a href="{{ '/blog' | relative_url }}" class="back-link">← Back to all posts</a>
  </footer>
</article>
